services:
  postgres:
    image: postgres:17
    container_name: education-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: education
      POSTGRES_PASSWORD: education123
      POSTGRES_DB: education_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: